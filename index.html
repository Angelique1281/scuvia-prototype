aison si un producteur vous livre, contenu de la commande.","Lors de la navigation : préférences techniques (langue, panier) conservées dans votre navigateur.","Le paiement est traité par [prestataire de paiement à désigner] : SCUVIA ne conserve pas vos données bancaires."]},{h:"Finalités et bases légales",p:["Traitement de votre commande et information sur son suivi — exécution du contrat.","Obligations comptables et fiscales — obligation légale.","Envoi des actualités et offres SCUVIA — uniquement avec votre consentement (case non précochée, facultative). Passer une commande ne vaut jamais consentement à recevoir des communications commerciales."]},{h:"Destinataires",p:["Chaque producteur reçoit uniquement les informations nécessaires pour honorer sa partie de la commande (nom, téléphone, adresse si livraison).","Les loueurs ne reçoivent pas les coordonnées des voyageurs : ils n'ont accès qu'à des statistiques globales.","Prestataires techniques : [hébergeur], [prestataire de paiement], [service d'envoi d'e-mails] — à compléter."]},{h:"Durées de conservation",p:["[Durées à définir pour chaque catégorie de données — commandes, comptabilité, newsletter, demandes d'exercice des droits.]"]},{h:"Vos droits",p:["Vous disposez d'un droit d'accès, de rectification, d'effacement, d'opposition, de limitation et de portabilité, ainsi que du droit de retirer votre consentement à tout moment.","Ces demandes peuvent être faites depuis la page « Préférences de communication » ou à [adresse e-mail]. Vous pouvez également introduire une réclamation auprès de la CNIL.","Chaque e-mail d'actualités contiendra un lien de désinscription."]},{h:"Transferts hors de l'Union européenne",p:["[À vérifier selon les prestataires retenus.]"]}],cgv:[{h:"Objet",p:["Les présentes conditions encadrent les commandes passées sur SCUVIA auprès des producteurs partenaires. [Rôle exact de SCUVIA dans la vente et identité du vendeur pour chaque produit : à préciser.]"]},{h:"Commande et confirmation",p:["
